[project]
name = "deep-research-agent"
version = "0.1.0"
description = "A deep research agent using LangGraph/LangChain Deep Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7",
    "tavily-python>=0.3",
    "httpx>=0.27",
    "markdownify>=0.12",
    "langchain-openai>=0.2",
    "langchain-core>=0.3",
    "python-dotenv>=1.0",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "cli", "test_agent"]
packages = ["tools"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
